<template>
    <lightning-card title="User Registration">
        <div class="slds-p-around_medium">
            <lightning-input label="First Name" value={firstName} onchange={handleChange} name="firstName"></lightning-input>
            <lightning-input label="Last Name" value={lastName} onchange={handleChange} name="lastName"></lightning-input>
            <lightning-input label="Email ID" value={email} onchange={handleChange} name="email" type="email"></lightning-input>
            <lightning-input label="Company Name" value={company} onchange={handleChange} name="company"></lightning-input>
            <lightning-input label="Country" value={country} onchange={handleChange} name="country"></lightning-input>
            <lightning-input label="Postal Code" value={postalCode} onchange={handleChange} name="postalCode"></lightning-input>
            <lightning-input label="Username" value={username} onchange={handleChange} name="username"></lightning-input>
            <lightning-input label="Password" value={password} onchange={handleChange} name="password" type="password"></lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button label="Save" onclick={registerUser} variant="brand"></lightning-button>
                <lightning-button label="Cancel" onclick={handleCancel} variant="neutral" class="slds-m-left_small"></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
