<template>
    <lightning-card title="Written Form">
        <div class="slds-p-horizontal_medium">
            <lightning-record-edit-form object-api-name="Written_Test__c"
                                        onsuccess={handleSuccess}>

                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Written_Test_Name__c" required></lightning-input-field>
                        <lightning-input-field field-name="College_ID__c" required></lightning-input-field>
                        <lightning-input-field field-name="Name"></lightning-input-field>
                        <lightning-input-field field-name="College_Name__c"></lightning-input-field>
                        <lightning-input-field field-name="Email_Id__c" required></lightning-input-field>
                    </div> 
                </div>

                <div class="slds-m-top_medium">
                    <lightning-button variant="brand" type="submit" label="Save" class="slds-m-right_small"></lightning-button>
                    <lightning-button variant="neutral" label="Save & New" onclick={handleSaveAndNew} class="slds-m-right_small"></lightning-button>
                    <lightning-button variant="destructive" label="Cancel" onclick={handleCancel}></lightning-button>
                </div>

            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
